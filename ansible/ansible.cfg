# ===================================================================
# Cấu hình Ansible cho project này
# ===================================================================
#
# Ansible tự đọc file này khi bạn chạy lệnh TỪ THƯ MỤC NÀY.
# Nhờ đó không phải gõ "-i inventory/hosts.ini" mỗi lần.
#
# Thứ tự Ansible tìm file cấu hình (cái đầu tiên thấy thì dùng):
#   1. Biến môi trường ANSIBLE_CONFIG
#   2. ./ansible.cfg      <- file này
#   3. ~/.ansible.cfg
#   4. /etc/ansible/ansible.cfg

[defaults]
# Inventory mặc định -> gõ "ansible all -m ping" là đủ
inventory = inventory/hosts.ini

# Tắt kiểm tra host key. CHỈ dùng khi học!
# Lab dựng lại liên tục nên host key đổi liên tục, bật lên sẽ bị chặn hoài.
# Server thật: BẬT lại (để yes) vì đây là lớp chống tấn công man-in-the-middle.
host_key_checking = False

# ===== GHI CHÚ VỀ CALLBACK (đọc kỹ để khỏi mất thời gian) =====
# Hai dòng dưới đây làm output đẹp hơn nhiều, nhưng CỐ Ý để dạng chú thích.
#
# Lý do: chúng thuộc collection "ansible.posix", KHÔNG có sẵn trong ansible-core.
# Bật lên khi chưa cài collection thì MỌI lệnh ansible đều chết ngay với lỗi:
#     ERROR! Invalid callback for stdout specified: yaml
#
# Muốn dùng thì cài collection trước:
#     ansible-galaxy collection install ansible.posix
# rồi bỏ dấu # ở hai dòng dưới.
#
# Kiểm tra máy bạn có callback nào:
#     ansible-doc -t callback -l
#
# stdout_callback = yaml              # in kết quả dạng YAML, dễ đọc hơn JSON
# callbacks_enabled = timer, profile_tasks   # hiện thời gian mỗi task

# Không tạo file .retry rác trong thư mục
retry_files_enabled = False

# Hỏi vault password khi playbook có biến mã hóa (Bài 4)
# Bỏ comment nếu muốn Ansible tự tìm file mật khẩu:
# vault_password_file = .vault_pass

[ssh_connection]
# Pipelining: giảm số lần SSH cho mỗi task -> nhanh hơn rõ rệt.
# Yêu cầu máy đích tắt "requiretty" trong sudoers (Ubuntu mặc định đã tắt).
pipelining = True

# Giữ kết nối SSH mở 60s để các task sau dùng lại, không bắt tay lại từ đầu
#
# IdentitiesOnly=yes + IdentityAgent=none: CHỈ dùng khóa khai báo trong
# inventory (ansible_ssh_private_key_file), KHÔNG lấy khóa từ ssh-agent.
#
# Vì sao bắt buộc? Nếu ssh-agent giữ nhiều khóa (gõ "ssh-add -l" để xem),
# ssh thử từng khóa trong agent TRƯỚC khóa của lab. Server chỉ cho tối đa
# 6 lần thử (MaxAuthTries), nên nó ngắt kết nối với lỗi
# "Too many authentication failures" trước khi khóa đúng được dùng.
# Ansible sẽ báo UNREACHABLE dù server hoàn toàn bình thường.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o IdentitiesOnly=yes -o IdentityAgent=none
