# ===================================================================
# INVENTORY — danh sách máy Ansible sẽ điều khiển
# ===================================================================
#
# Inventory trả lời 2 câu hỏi: điều khiển MÁY NÀO, và ĐĂNG NHẬP thế nào.
# Không có inventory, Ansible không biết đi đâu.
#
# Định dạng INI (dễ đọc cho người mới). Ansible cũng nhận YAML.
# Xem Ansible hiểu file này ra sao:
#   ansible-inventory --graph
#   ansible-inventory --list

# ===== NHÓM webservers: các máy chạy ứng dụng =====
# "web1" là BÍ DANH tự đặt, không phải tên miền thật.
# ansible_host mới là địa chỉ thật để kết nối.
[webservers]
web1 ansible_host=localhost ansible_port=2201
web2 ansible_host=localhost ansible_port=2202

# ===== Biến áp dụng cho MỌI máy trong nhóm webservers =====
# Viết ở đây thay vì lặp lại trên từng dòng máy -> sửa một chỗ, đổi tất cả.
[webservers:vars]
# Đăng nhập bằng user nào
ansible_user=deploy

# Khóa riêng để chứng minh danh tính (không dùng mật khẩu)
ansible_ssh_private_key_file=~/.ssh/ansible_lab

# Đường dẫn Python trên máy đích.
# Ansible KHÔNG chạy bằng bash — nó đẩy module Python lên rồi thực thi.
# Khai báo rõ để Ansible không phải đoán và không cảnh báo.
ansible_python_interpreter=/usr/bin/python3

# ===== Nhóm cha: gom nhiều nhóm con lại =====
# Hiện chỉ có webservers. Khi thêm dbservers, loadbalancer thì gom vào đây
# để chạy một lệnh tác động cả hệ thống.
[production:children]
webservers

# ===================================================================
# GỢI Ý MỞ RỘNG — tách môi trường staging và production
# ===================================================================
# Thực tế người ta tạo 2 file riêng:
#   inventory/staging.ini     -> 1 server, mật khẩu yếu, cho phép test phá
#   inventory/production.ini  -> nhiều server, mật khẩu mạnh
#
# Rồi chỉ định lúc chạy:
#   ansible-playbook -i inventory/staging.ini playbooks/deploy-app.yml
#
# CÙNG MỘT playbook, khác inventory -> khác môi trường.
# Đó là lý do playbook không bao giờ được hard-code địa chỉ server.
