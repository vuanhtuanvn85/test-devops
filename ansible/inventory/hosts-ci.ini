# ===================================================================
# INVENTORY DÙNG KHI CHẠY TỪ TRONG CONTAINER JENKINS
# ===================================================================
#
# Vì sao cần inventory RIÊNG, không dùng lại hosts.ini?
#
# Cùng hai server web1/web2, nhưng ĐƯỜNG ĐI tới chúng khác nhau tùy vị trí
# người gọi:
#
#   Từ laptop (hosts.ini):
#       laptop -> cổng forward 2201/2202 -> container
#       => ansible_host=localhost, ansible_port=2201
#
#   Từ container Jenkins (file này):
#       jenkins -> mạng ansible-labnet -> container, cổng 22 thật
#       => ansible_host=ansible-web1, ansible_port=22
#
# Jenkins KHÔNG dùng được localhost:2201 vì "localhost" trong container
# Jenkins là chính nó, không phải laptop.
#
# Tên "ansible-web1" là container_name trong ansible/lab/docker-compose.yml.
# Docker có DNS nội bộ cho từng mạng, nên trong cùng mạng thì gọi được
# nhau bằng tên — không cần biết IP, và IP đổi sau mỗi lần dựng lại.
#
# Cách dùng:
#   ansible-playbook -i inventory/hosts-ci.ini playbooks/04-rolling-update.yml \
#     -e image_tag=ghcr.io/user/app:abc1234
#
# Kiểm tra từ trong container Jenkins:
#   docker exec jenkins ansible all -i inventory/hosts-ci.ini -m ping

[webservers]
web1 ansible_host=ansible-web1 ansible_port=22
web2 ansible_host=ansible-web2 ansible_port=22

[webservers:vars]
ansible_user=deploy

# Khóa riêng: Jenkins lấy từ credential rồi ghi ra file tạm, đường dẫn
# truyền vào lúc chạy bằng -e ansible_ssh_private_key_file=...
# KHÔNG hard-code đường dẫn khóa ở đây — khóa không nằm trong repo.

ansible_python_interpreter=/usr/bin/python3

[production:children]
webservers

# ===================================================================
# LƯU Ý VỀ group_vars
# ===================================================================
# group_vars/ nằm cạnh file inventory, tức inventory/group_vars/.
# File này ở CÙNG thư mục với hosts.ini nên dùng CHUNG group_vars —
# app_dir, web_port, postgres_user... không phải khai báo lại.
#
# Đó là lý do đặt file ở đây thay vì tạo thư mục inventory-ci/ riêng:
# tách ra thì phải nhân bản group_vars, sửa một chỗ quên chỗ kia.
