# Secret = giống ConfigMap nhưng dành cho dữ liệu nhạy cảm (mật khẩu, token, khoá API).
#
# Đối chiếu Docker Compose: các biến POSTGRES_PASSWORD trong file .env.
#
# CẢNH BÁO PHẢI NÓI RÕ VỚI SINH VIÊN:
# Secret mặc định CHỈ được mã hoá base64 - tức là chỉ "che mắt", KHÔNG phải mã hoá.
# Ai cũng giải ngược được:
#   echo 'ZGljdHBhc3M=' | base64 -d      # => dictpass
#
# Vì vậy file này CHỈ dùng cho lớp học. Thực tế phải dùng:
#   - Sealed Secrets / External Secrets Operator (đồng bộ từ Vault, AWS Secrets Manager)
#   - Bật encryption-at-rest cho etcd của cluster
# và TUYỆT ĐỐI không commit Secret thật lên git.

apiVersion: v1
kind: Secret
metadata:
  name: dictionary-secret
  namespace: dictionary
type: Opaque

# stringData: viết giá trị dạng chữ thường, K8s tự base64 khi lưu.
# (Nếu dùng "data:" thì phải tự base64 trước - dễ sai, nên dùng stringData cho dễ đọc.)
stringData:
  POSTGRES_USER: dictuser
  POSTGRES_PASSWORD: dictpass
